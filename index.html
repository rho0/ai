<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="학교 구성원을 위한 멀티 모델 AI 채팅 서비스">
  <title>Multi Model AI Agent</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>

  <!-- 기존의 큰 스타일 블록들 (원본) 은 변경하지 않고 유지합니다.
       실제 파일에서는 원본 스타일 전체가 그대로 남아있어야 합니다. -->
  <style>
    /* === 원본 스타일들 (생략하지 말고 실제 파일에서는 전체 포함) === */
    /* (원본 index.html의 모든 기존 CSS가 여기에 들어갑니다.) */

    /* 접근성: skip link 스타일 및 포커스 가시성 보강 */
    .skip-link {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 30;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(30,30,30,0.06);
      padding: 8px 12px;
      border-radius: 8px;
      color: #0f1724;
      text-decoration: none;
      transform: translateY(-120%);
      transition: transform 160ms ease, opacity 160ms ease;
      opacity: 0;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(16,24,40,0.06);
    }
    .skip-link:focus {
      transform: translateY(0);
      opacity: 1;
      outline: 3px solid rgba(79,106,240,0.18);
      outline-offset: 4px;
    }

    /* 포커스 가시성 개선 */
    :focus {
      outline: none;
    }
    :focus-visible {
      outline: 3px solid rgba(30, 99, 233, .22);
      outline-offset: 3px;
      border-radius: 8px;
    }

    /* 환영 오버레이(초기 안내) 추가 스타일 (원본 디자인과 어울리게) */
    .welcome-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none; /* 클릭이 입력 박스로 전달되도록 기본은 none */
      z-index: 12;
    }

    .welcome-card {
      pointer-events: auto;
      width: min(720px, calc(100% - 48px));
      max-width: 820px;
      padding: clamp(18px, 3.2vw, 28px);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,250,252,0.96));
      border: 1px solid rgba(30,40,60,0.06);
      box-shadow: 0 10px 30px rgba(20,30,50,0.06);
      text-align: center;
      transform-origin: center;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .welcome-orb {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, #6d8bff, #9b85f8);
      box-shadow: 0 8px 26px rgba(109, 139, 255, .22);
      font-weight: 700;
      font-size: 18px;
    }

    .welcome-title {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 22px);
      font-weight: 700;
      color: var(--ink, #1b2540);
      letter-spacing: -0.01em;
    }

    .welcome-sub {
      margin: 10px auto 0;
      color: var(--muted, #6b7280);
      font-size: 14px;
      line-height: 1.6;
      max-width: 600px;
    }

    .welcome-close {
      position: absolute;
      top: 10px;
      right: 10px;
      border: 0;
      background: transparent;
      color: #6b7280;
      font-size: 18px;
      padding: 6px;
      border-radius: 8px;
      cursor: pointer;
    }
    .welcome-close:focus-visible {
      outline: 3px solid rgba(30,99,233,0.22);
    }

    .welcome-overlay.hidden { opacity: 0; transform: translateY(6px) scale(0.998); pointer-events: none; visibility: hidden; }
    .welcome-overlay.visible { opacity: 1; transform: translateY(0) scale(1); visibility: visible; }

    @media (max-width: 780px) {
      .welcome-card { border-radius: 14px; padding: 18px; width: calc(100% - 32px); }
      .welcome-orb { width: 44px; height: 44px; font-size: 16px; }
    }

    /* 채팅 항목이 포커스될 때 시각적으로 보이도록 보강 */
    .chat-item[tabindex="0"]:focus-visible {
      outline: 3px solid rgba(79,106,240,0.18);
      outline-offset: 2px;
    }
  </style>

  <!-- 접근성 관련 스크립트: 포커스 트랩, 키보드 지원, ARIA 속성 보강 -->
  <script>
    (function () {
      // 유틸: 키가 Enter 또는 Space인지 확인
      function isActivateKey(e) {
        return e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar';
      }

      // 채팅 항목에 키보드 동작 바인딩 (Enter/Space로 클릭 트리거)
      function enableKeyboardOnChatItems() {
        var items = document.querySelectorAll('.chat-item');
        items.forEach(function (it) {
          // 이미 tabindex를 지정했으면 건너뜀
          if (!it.hasAttribute('tabindex')) it.setAttribute('tabindex', '0');
          // role이 없으면 role="button"
          if (!it.hasAttribute('role')) it.setAttribute('role', 'button');
          // aria-label 보강: 내부 제목/텍스트가 있으면 사용
          if (!it.hasAttribute('aria-label')) {
            var titleEl = it.querySelector('.chat-title');
            var metaEl = it.querySelector('.chat-meta');
            var label = titleEl ? titleEl.textContent.trim() : it.textContent.trim().slice(0, 50);
            if (metaEl && metaEl.textContent.trim()) label += ' — ' + metaEl.textContent.trim();
            it.setAttribute('aria-label', label || '대화 항목');
          }

          // 클릭 및 키 이벤트
          it.addEventListener('keydown', function (e) {
            if (isActivateKey(e)) {
              e.preventDefault();
              it.click();
            }
          });

          // On Enter / Space we also set aria-current appropriately (optional)
          it.addEventListener('click', function () {
            // Set aria-current on clicked item; remove from siblings (improves SR feedback)
            document.querySelectorAll('.chat-item[aria-current="true"]').forEach(function (s) {
              s.removeAttribute('aria-current');
            });
            it.setAttribute('aria-current', 'true');
          });
        });
      }

      // 환영 오버레이 생성/관리 (접근성 다이얼로그)
      function createWelcomeOverlay() {
        if (document.querySelector('.welcome-overlay')) return;

        // 대상 컨테이너 탐색
        var container = document.querySelector('.webchat-mount') || document.getElementById('webchat') || document.querySelector('.workspace') || document.body;
        // overlay 요소 생성
        var overlay = document.createElement('div');
        overlay.className = 'welcome-overlay visible';
        overlay.setAttribute('role', 'dialog');
        overlay.setAttribute('aria-modal', 'true');
        overlay.setAttribute('aria-label', '도움말: 무엇이든 물어보세요');
        overlay.setAttribute('tabindex', '-1');

        var card = document.createElement('div');
        card.className = 'welcome-card';
        card.setAttribute('role', 'document');

        var closeBtn = document.createElement('button');
        closeBtn.className = 'welcome-close';
        closeBtn.setAttribute('aria-label', '환영 메시지 닫기');
        closeBtn.innerHTML = '&#x2715;'; // ×
        closeBtn.addEventListener('click', function (e) {
          e.stopPropagation();
          hideOverlay(overlay);
        });

        var orb = document.createElement('div');
        orb.className = 'welcome-orb';
        orb.textContent = '✦';

        var title = document.createElement('h2');
        title.className = 'welcome-title';
        title.textContent = '무엇이든 물어보세요';

        var sub = document.createElement('p');
        sub.className = 'welcome-sub';
        sub.textContent = '궁금한 것을 입력하면 AI가 다양한 모델을 활용해 도와드립니다. 예) 숙제 도와줘, 강의 자료 찾아줘, 일정 알려줘';

        card.appendChild(closeBtn);
        card.appendChild(orb);
        card.appendChild(title);
        card.appendChild(sub);
        overlay.appendChild(card);

        // 위치: container 내부에 삽입. container가 body이면 body에 추가
        if (container === document.body) {
          document.body.appendChild(overlay);
        } else {
          // container에 상대 포지션 필요 시 보장
          var style = getComputedStyle(container);
          if (style.position === 'static') container.style.position = 'relative';
          container.appendChild(overlay);
        }

        // 포커스 트랩 초기화
        trapFocus(overlay);

        // ESC로 닫기
        overlay.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' || e.key === 'Esc') {
            e.stopPropagation();
            hideOverlay(overlay);
          }
        });

        // 배경 클릭으로 닫기 (카드 내부 클릭 제외)
        overlay.addEventListener('click', function (e) {
          if (e.target === overlay) hideOverlay(overlay);
        });

        // 숨김 트리거: 입력 포커스/입력 또는 webchat에 노드 추가 시
        var inputSelectors = [
          '#webchat textarea',
          '#webchat input[type="text"]',
          '.webchat__send-box-text-box__input',
          '.webchat__send-box-text-box textarea'
        ];
        var bound = false;
        inputSelectors.forEach(function (sel) {
          var el = document.querySelector(sel);
          if (el && !bound) {
            el.addEventListener('focus', function () { hideOverlay(overlay); }, { once: true, passive: true });
            el.addEventListener('input', function () { hideOverlay(overlay); }, { once: true, passive: true });
            bound = true;
          }
        });

        // webchat 에 메시지 추가 감지
        var transcript = document.querySelector('#webchat .webchat__basic-transcript') || document.querySelector('.webchat__basic-transcript') || document.querySelector('#webchat');
        if (transcript) {
          var mo = new MutationObserver(function (mutations, obs) {
            for (var mu of mutations) {
              if (mu.addedNodes && mu.addedNodes.length) {
                hideOverlay(overlay);
                obs.disconnect();
                return;
              }
            }
          });
          mo.observe(transcript, { childList: true, subtree: true });
        }
      }

      // 포커스 트랩: 다이얼로그 열릴 때 내부로 포커스를 가두고 닫힐 때 복구.
      function trapFocus(overlay) {
        var focusableSelectors = [
          'a[href]', 'area[href]', 'input:not([disabled])', 'select:not([disabled])',
          'textarea:not([disabled])', 'button:not([disabled])', 'iframe', 'object', 'embed',
          '[contenteditable]', '[tabindex]:not([tabindex^="-"])'
        ];
        var focusable = overlay.querySelectorAll(focusableSelectors.join(','));
        var first = focusable[0];
        var last = focusable[focusable.length - 1];

        var previouslyFocused = document.activeElement;

        // focus the overlay itself if no tabbable element inside
        if (first) first.focus();
        else overlay.focus();

        function onKeydown(e) {
          if (e.key === 'Tab') {
            if (focusable.length === 0) {
              e.preventDefault();
              return;
            }
            if (e.shiftKey) {
              if (document.activeElement === first) {
                e.preventDefault();
                last.focus();
              }
            } else {
              if (document.activeElement === last) {
                e.preventDefault();
                first.focus();
              }
            }
          }
        }

        overlay.addEventListener('keydown', onKeydown);

        overlay._removeTrap = function () {
          overlay.removeEventListener('keydown', onKeydown);
          if (previouslyFocused && previouslyFocused.focus) previouslyFocused.focus();
        };
      }

      function hideOverlay(overlay) {
        if (!overlay) return;
        overlay.classList.remove('visible');
        overlay.classList.add('hidden');
        overlay.setAttribute('aria-hidden', 'true');
        // remove focus trap
        if (overlay._removeTrap) overlay._removeTrap();
        setTimeout(function () {
          if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 300);
      }

      // 접근성 보강 초기화
      function initAccessibilityEnhancements() {
        // Skip link 생성 (맨 위)
        if (!document.querySelector('.skip-link')) {
          var skip = document.createElement('a');
          skip.className = 'skip-link';
          skip.href = '#webchat';
          skip.textContent = '채팅으로 건너뛰기';
          skip.addEventListener('click', function () {
            // focus the webchat main region after skip
            setTimeout(function () {
              var target = document.getElementById('webchat') || document.querySelector('.webchat-mount');
              if (target) target.setAttribute('tabindex', '-1'), target.focus();
            }, 0);
          });
          document.body.appendChild(skip);
        }

        // 웹챗 영역 role/aria-live 보장
        var webchat = document.getElementById('webchat') || document.querySelector('.webchat-mount');
        if (webchat) {
          webchat.setAttribute('role', 'region');
          webchat.setAttribute('aria-label', 'AI 채팅');
          // ARIA live는 workspace에 이미 있을 수 있으므로 중복 설정 시 영향 없게 함
          var workspace = document.querySelector('.workspace');
          if (workspace) workspace.setAttribute('aria-live', 'polite');
        }

        // 주요 인터랙션 aria-labels/role 보강
        var newChatBtn = document.querySelector('.new-chat');
        if (newChatBtn && !newChatBtn.hasAttribute('aria-label')) {
          newChatBtn.setAttribute('aria-label', '새 대화 시작');
        }

        var modelSelect = document.querySelector('.model-select');
        if (modelSelect && !modelSelect.hasAttribute('aria-label')) {
          modelSelect.setAttribute('aria-label', '모델 선택');
        }

        // 상태바에 role=status
        var statusbar = document.querySelector('.statusbar');
        if (statusbar && !statusbar.hasAttribute('role')) {
          statusbar.setAttribute('role', 'status');
          statusbar.setAttribute('aria-live', 'polite');
        }

        // 토스트에 role=status (있다면)
        document.querySelectorAll('.toast').forEach(function (t) {
          if (!t.hasAttribute('role')) t.setAttribute('role', 'status');
        });

        // chat items keyboard enable
        enableKeyboardOnChatItems();

        // 관찰: 동적으로 추가되는 .chat-item 에도 키보드 바인딩 적용
        var bodyObserver = new MutationObserver(function (mutations) {
          for (var mu of mutations) {
            if (mu.addedNodes && mu.addedNodes.length) {
              mu.addedNodes.forEach(function (node) {
                if (node.nodeType === 1) {
                  if (node.matches && node.matches('.chat-item')) {
                    enableKeyboardOnChatItems();
                  } else {
                    var nested = node.querySelector && node.querySelector('.chat-item');
                    if (nested) enableKeyboardOnChatItems();
                  }
                }
              });
            }
          }
        });
        bodyObserver.observe(document.body, { childList: true, subtree: true });
      }

      // DOM 준비 후 초기화
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function () {
          initAccessibilityEnhancements();
          // 환영 오버레이 생성 (원하면 주석 처리 가능)
          createWelcomeOverlay();
        }, { once: true });
      } else {
        initAccessibilityEnhancements();
        createWelcomeOverlay();
      }
    })();
  </script>
</head>
<body>
  <!-- Skip link (keyboard users can 탭으로 접근하여 본문으로 건너뜁니다) -->
  <!-- (스크립트에서 중복 생성 방지를 이미 처리하므로 이 엘리먼트는 있어도 되고 없어도 됩니다) -->
  <a class="skip-link" href="#webchat">채팅으로 건너뛰기</a>

  <div class="app-shell">
    <aside class="sidebar" aria-label="사이드바">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div class="brand-copy">
          <strong>Multi Model AI</strong>
          <span>학교 구성원을 위한 AI 채팅</span>
        </div>
      </div>

      <button class="new-chat" type="button" aria-label="새 대화 시작">새 대화</button>

      <div class="section-label" aria-hidden="true">대화</div>

      <div class="chat-list" role="list" aria-label="대화 목록">
        <!-- 예시 chat-item; 실제 항목은 동적으로 채워질 수 있음 -->
        <div class="chat-item" role="button" tabindex="0" aria-label="예시 대화 1" aria-current="true">
          <div class="chat-main">
            <div class="chat-title">예시 대화 1</div>
            <div class="chat-meta">몇 분 전</div>
          </div>
          <div class="item-menu" aria-hidden="true">⋯</div>
        </div>

        <div class="chat-item" role="button" tabindex="0" aria-label="예시 대화 2">
          <div class="chat-main">
            <div class="chat-title">예시 대화 2</div>
            <div class="chat-meta">어제</div>
          </div>
          <div class="item-menu" aria-hidden="true">⋯</div>
        </div>
        <!-- 실제 목록은 기존 로직으로 유지됩니다 -->
      </div>

      <div class="sidebar-footer">
        <div class="history-notice">대화 기록은 안전하게 보관됩니다.</div>
      </div>
    </aside>

    <main class="main" role="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" aria-label="메뉴 열기" aria-expanded="false" style="display:none">☰</button>
          <div class="session-copy" aria-hidden="true"></div>
          <div class="session-title" aria-live="polite">환영합니다</div>
        </div>
        <div class="route-control" aria-hidden="false">
          <div class="route-badge" aria-hidden="true">기본</div>
          <select class="model-select" aria-label="모델 선택">
            <option>기본 모델</option>
          </select>
        </div>
      </div>

      <div class="workspace" aria-live="polite">
        <!-- 웹챗이 실제로 렌더되는 위치 (#webchat 또는 .webchat-mount) -->
        <div id="webchat" class="webchat-mount" style="width:100%;height:100%;position:relative;" tabindex="-1" role="region" aria-label="AI 채팅">
          <!-- BotFramework WebChat이 이 영역에 마운트 됩니다. -->
        </div>

        <!-- 환영 오버레이는 스크립트로 동적으로 생성됩니다. (초기에는 createWelcomeOverlay()가 삽입합니다) -->
      </div>

      <div class="statusbar" role="status" aria-live="polite">
        <div><span class="status-dot online" aria-hidden="true"></span> 연결됨</div>
        <div>버전 1.0</div>
      </div>
    </main>
  </div>

  <!-- 기존의 스크립트, 웹챗 초기화 코드는 변함없이 유지되어야 합니다.
       아래는 예시 주석 — 실제 파일에는 기존 JS들이 그대로 남아있어야 합니다. -->

  <!-- 예: BotFramework WebChat 초기화 스크립트 (원본 유지) -->
  <script>
    /* 기존 webchat 초기화 스크립트가 여기에 들어갑니다. 예:
    window.WebChat.renderWebChat({...}, document.getElementById('webchat')); 
    */
  </script>
</body>
</html>
