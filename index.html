<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="학교 구성원을 위한 멀티 모델 AI 채팅 서비스">
  <title>Multi Model AI Agent</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>

  <style>
    :root {
      --page: #f3f5f7;
      --page-accent: #e8edf4;
      --glass: rgba(255, 255, 255, 0.72);
      --glass-strong: rgba(255, 255, 255, 0.9);
      --line: rgba(27, 38, 55, 0.1);
      --line-strong: rgba(27, 38, 55, 0.16);
      --ink: #172033;
      --muted: #687386;
      --quiet: #8e98a8;
      --accent: #6d28d9;               /* purple accent */
      --accent-soft: #f0e8ff;
      --danger: #c63d49;
      --shadow: 0 18px 60px rgba(25, 39, 61, 0.09);
      --radius-xl: 26px;
      --radius-lg: 18px;
      --radius-md: 13px;
      --btn-radius: 14px; /* more rounded buttons */
      --sidebar-width: 282px;
      --ease: 180ms cubic-bezier(.2, .75, .25, 1);
      --focus-ring: 0 0 0 4px rgba(109,40,217,.12);
    }

    /* Basic resets */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(255,255,255,.98) 0 16%, transparent 42%),
        radial-gradient(circle at 88% 92%, rgba(218,228,243,.7), transparent 38%),
        linear-gradient(135deg, var(--page), var(--page-accent));
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Skip link for keyboard users */
    .skip-link {
      position: absolute;
      left: 12px;
      top: 12px;
      z-index: 60;
      background: white;
      color: var(--ink);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      transform: translateY(-120%);
      transition: transform 160ms ease-in-out;
    }
    .skip-link:focus { transform: translateY(0); outline: none; box-shadow: var(--focus-ring); }

    /* Visual focus style for keyboard users */
    :focus { outline: none; }
    :focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 8px; }

    /* Buttons: more rounded, refined, with smooth hover animation */
    button, .primary-button, .secondary-button {
      transition: transform var(--ease), box-shadow var(--ease), background-color var(--ease), border-color var(--ease);
      border-radius: var(--btn-radius);
      padding: 10px 14px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active, .primary-button:active, .secondary-button:active {
      transform: translateY(1px) scale(.998);
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      button, .primary-button, .secondary-button { transition: none; }
    }

    .app-shell {
      width: min(1540px, calc(100% - 28px));
      height: min(940px, calc(100% - 28px));
      margin: 14px auto;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      border: 1px solid rgba(255,255,255,.86);
      border-radius: var(--radius-xl);
      overflow: hidden;
      background: rgba(255,255,255,.42);
      box-shadow: var(--shadow);
      backdrop-filter: blur(30px) saturate(135%);
      -webkit-backdrop-filter: blur(30px) saturate(135%);
    }

    .sidebar {
      position: relative;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding: 20px 14px 14px;
      border-right: 1px solid var(--line);
      background: rgba(246, 248, 251, .74);
      z-index: 5;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 2px 8px 18px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: white;
      background: linear-gradient(145deg, #252f43, #111827);
      box-shadow: 0 7px 18px rgba(19, 29, 47, .16);
      font-size: 20px;
      font-weight: 760;
      letter-spacing: -.04em;
    }

    .brand-copy strong { display: block; font-size: 15px; letter-spacing: -.015em; }
    .brand-copy span { display: block; margin-top: 2px; color: var(--quiet); font-size: 11px; }

    /* New chat button styling (rounded & refined) */
    .new-chat {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line-strong);
      border-radius: var(--btn-radius);
      color: var(--ink);
      background: var(--glass-strong);
      cursor: pointer;
      transition: transform var(--ease), border-color var(--ease), background var(--ease), box-shadow var(--ease);
    }
    .new-chat:hover { transform: translateY(-4px); border-color: rgba(109,40,217,.28); background: #fff; box-shadow: 0 10px 30px rgba(109,40,217,.06); }
    .new-chat:focus-visible { box-shadow: var(--focus-ring); }

    .section-label {
      margin: 21px 9px 8px;
      color: var(--quiet);
      font-size: 20px;
      font-weight: 680;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .chat-list {
      min-height: 0;
      flex: 1;
      overflow: auto;
      padding: 0 2px 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(80,91,108,.22) transparent;
    }

    .chat-item {
      position: relative;
      width: 100%;
      min-height: 48px;
      margin: 6px 0;
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: inherit;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .chat-item:hover { background: rgba(255,255,255,.68); transform: translateY(-2px); transition: transform var(--ease), background var(--ease); }
    .chat-item:focus-visible { box-shadow: var(--focus-ring); transform: translateY(-2px); }

    .chat-item[aria-current="true"] { border-color: var(--line); background: rgba(255,255,255,.86); }

    .chat-main { min-width: 0; }
    .chat-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 590; }
    .chat-meta { margin-top: 4px; color: var(--quiet); font-size: 10px; }

    .item-menu {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 12px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      opacity: .2;
      transition: background var(--ease), color var(--ease), transform var(--ease);
    }
    .item-menu:hover, .item-menu:focus-visible { opacity: 1; background: rgba(0,0,0,.03); transform: translateY(-2px); }

    .sidebar-footer { padding: 12px 6px 2px; border-top: 1px solid var(--line); }

    .history-notice {
      margin: 0;
      padding: 3px 6px 1px;
      color: var(--quiet);
      font-size: 10.5px;
      line-height: 1.55;
      word-break: keep-all;
    }

    .delete-chat { color: var(--quiet); }
    .delete-chat:hover { color: var(--danger); background: rgba(198,61,73,.07); }

    .trash-icon {
      position: relative;
      width: 11px;
      height: 12px;
      border: 1.4px solid currentColor;
      border-top: 0;
      border-radius: 0 0 3px 3px;
    }

    .main {
      min-width: 0;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0,1fr) auto;
      background: rgba(255,255,255,.56);
    }

    .topbar {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px clamp(15px, 3vw, 34px);
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.58);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 3;
    }

    .topbar-left { min-width: 0; display: flex; align-items: center; gap: 12px; }
    .mobile-menu { display: none; }
    .session-copy { min-width: 0; }
    .session-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 670; }

    .route-control { display: flex; align-items: center; gap: 9px; }

    .route-badge {
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 6px 9px;
      border: 1px solid rgba(109,40,217,.13);
      border-radius: 999px;
      color: #5b21b6;
      background: var(--accent-soft);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .model-select {
      min-height: 40px;
      max-width: 210px;
      padding: 0 36px 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(255,255,255,.86);
      cursor: pointer;
    }
    .model-select:focus-visible { box-shadow: var(--focus-ring); }

    .workspace { position: relative; min-height: 0; overflow: hidden; }
    #webchat, #archive { width: 100%; height: 100%; }
    #webchat { background: transparent; }
    .webchat-mount { width: 100%; height: 100%; min-height: 0; }

    .state-panel, .empty-state {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .state-card, .empty-card {
      width: min(560px, 100%);
      padding: clamp(24px, 5vw, 42px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,.72);
      box-shadow: 0 16px 46px rgba(30,42,61,.06);
      text-align: center;
    }

    .orb {
      width: 52px;
      height: 52px;
      margin: 0 auto 17px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(109,40,217,.15);
      border-radius: 17px;
      color: var(--accent);
      background: linear-gradient(145deg, #fff, #f0e8ff);
      font-weight: 760;
      box-shadow: 0 10px 30px rgba(109,40,217,.12);
    }

    .state-card h2, .empty-card h2 { margin: 0; font-size: clamp(21px, 3vw, 29px); letter-spacing: -.035em; }
    .state-card p, .empty-card p { margin: 11px auto 0; max-width: 460px; color: var(--muted); font-size: 13px; line-height: 1.65; }

    .primary-button, .secondary-button {
      min-height: 44px;
      margin-top: 19px;
      padding: 10px 18px;
      border-radius: var(--btn-radius);
      cursor: pointer;
      font-weight: 600;
    }

    .primary-button { border: 1px solid #5b21b6; color: white; background: var(--accent); box-shadow: 0 6px 18px rgba(124,92,255,.12); }
    .primary-button:hover { transform: translateY(-4px); box-shadow: 0 14px 40px rgba(124,92,255,.14); }
    .primary-button:focus-visible { box-shadow: var(--focus-ring); }

    .secondary-button { border: 1px solid var(--line); color: var(--ink); background: white; }
    .secondary-button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(16,24,40,.06); }
    .secondary-button:focus-visible { box-shadow: var(--focus-ring); }

    .archive-view { height: 100%; overflow: auto; padding: 30px clamp(18px, 6vw, 88px); }
    .archive-note { max-width: 760px; margin: 0 auto 22px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); background: rgba(255,255,255,.72); font-size: 13px; }
    .archive-message { max-width: 760px; margin: 0 auto 18px; }
    .archive-role { margin-bottom: 5px; color: var(--quiet); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .archive-bubble { display: inline-block; max-width: 86%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.82); white-space: pre-wrap; overflow-wrap: anywhere; }
    .archive-message.user { text-align: right; }
    .archive-message.user .archive-bubble { color: white; border-color: #5b21b6; background: var(--accent); text-align: left; }

    .statusbar {
      min-height: 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px clamp(15px, 3vw, 34px);
      border-top: 1px solid var(--line);
      color: var(--quiet);
      background: rgba(255,255,255,.62);
      font-size: 10px;
    }

    .status-dot { width: 6px; height: 6px; display: inline-block; margin-right: 6px; border-radius: 50%; background: #a5adba; }
    .status-dot.online { background: #39a568; box-shadow: 0 0 0 3px rgba(57,165,104,.1); }
    .status-dot.error { background: var(--danger); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      max-width: min(460px, calc(100% - 32px));
      padding: 11px 15px;
      border: 1px solid var(--line-strong);
      border-radius: 12px;
      color: var(--ink);
      background: rgba(255,255,255,.95);
      box-shadow: 0 12px 40px rgba(18,31,52,.15);
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--ease), transform var(--ease);
      z-index: 20;
      font-size: 12px;
    }

    .toast.visible { opacity: 1; transform: translate(-50%, 0); }

    /* overlay for mobile sidebar */
    .sidebar-scrim {
      display: none;
    }

    @media (max-width: 780px) {
      .app-shell { width: 100%; height: 100%; margin: 0; grid-template-columns: 1fr; border: 0; border-radius: 0; }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: min(310px, 86vw);
        transform: translateX(-102%);
        transition: transform var(--ease);
        box-shadow: 18px 0 48px rgba(20,31,50,.16);
      }
      body.sidebar-open .sidebar { transform: translateX(0); }
      .sidebar-scrim { position: fixed; inset: 0; display: block; border: 0; background: rgba(26,37,54,.2); opacity: 0; pointer-events: none; transition: opacity var(--ease); z-index: 4; }
      body.sidebar-open .sidebar-scrim { opacity: 1; pointer-events: auto; }
      .mobile-menu { width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 12px; color: var(--ink); background: rgba(255,255,255,.82); cursor: pointer; transition: transform var(--ease), box-shadow var(--ease); }
      .mobile-menu:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(16,24,40,.06); }
      .topbar { min-height: 66px; }
      .route-badge { display: none; }
      .model-select { max-width: 156px; font-size: 12px; }
      .statusbar { padding-bottom: max(7px, env(safe-area-inset-bottom)); }
    }

    @media (max-width: 470px) {
      .session-copy { display: none; }
      .topbar { padding-inline: 11px; }
      .model-select { max-width: 202px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }

    /* Chat redesign / greeting styles */
    .instant-greeting {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 0 120px;
      pointer-events: none; /* decorative; clicks go through to chat if needed */
    }

    .instant-greeting-message {
      width: min(820px, calc(100% - 40px));
      margin: 0 auto;
      color: #202020;
      font-size: 18px;
      line-height: 1.6;
      white-space: pre-wrap;
      text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.85));
      border: 1px solid rgba(30,30,30,.04);
      padding: 18px 22px;
      border-radius: 14px;
      box-shadow: 0 10px 28px rgba(16,24,40,.06);
    }

    .instant-greeting-message strong {
      color: var(--accent);
      font-weight: 700;
      font-size: 20px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .instant-greeting-message .hint {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    /* Ensure greeting placement doesn't collide visually */
    #webchat + .instant-greeting,
    .instant-greeting + .state-panel { margin-top: -8px; }
  </style>
</head>
<body>
  <a class="skip-link" href="#webchat">채팅으로 바로 이동 (Skip to chat)</a>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="사이드바" aria-hidden="false" role="navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✨</div>
        <div class="brand-copy">
          <strong>Multi Model AI</strong>
          <span>학교 전용 챗봇</span>
        </div>
      </div>

      <button id="newChatBtn" class="new-chat" type="button" aria-label="새 대화 시작">새 대화 시작</button>

      <div class="section-label" id="conversationsLabel">대화</div>
      <div class="chat-list" role="list" aria-labelledby="conversationsLabel">
        <!-- Example list items (client will populate real items) -->
        <!-- Each item is keyboard-focusable and accessible -->
        <div class="chat-item" role="listitem" tabindex="0" aria-current="false">
          <div class="chat-main">
            <div class="chat-title">샘플 대화 1</div>
            <div class="chat-meta">지난 대화 · 2시간 전</div>
          </div>
          <button class="item-menu" aria-label="대화 옵션">⋯</button>
        </div>
      </div>

      <footer class="sidebar-footer">
        <div class="history-notice">대화 내역은 안전하게 보관됩니다.</div>
      </footer>
    </aside>

    <!-- scrim / overlay used on mobile when sidebar is open -->
    <button class="sidebar-scrim" aria-hidden="true" tabindex="-1"></button>

    <main class="main" role="main">
      <div class="topbar" role="region" aria-label="상단 바">
        <div class="topbar-left">
          <!-- menu button toggles sidebar on mobile -->
          <button class="mobile-menu" aria-label="메뉴" aria-controls="sidebar" aria-expanded="false" aria-haspopup="true">☰</button>

          <div class="session-copy">
            <div class="session-title">새 대화</div>
            <div class="route-control">
              <div class="route-badge" role="status" aria-hidden="false">기본 모델</div>
            </div>
          </div>
        </div>

        <div>
          <label for="modelSelect" class="sr-only">모델 선택</label>
          <select id="modelSelect" class="model-select" aria-label="모델 선택">
            <option>Model A</option>
            <option>Model B</option>
          </select>
        </div>
      </div>

      <section class="workspace" aria-live="polite">
        <!-- Webchat mount (bot framework or other chat UI) -->
        <div id="webchat" class="webchat-mount" role="region" aria-label="웹챗" tabindex="0"></div>

        <!-- First-screen friendly instant greeting: prominent, natural, and unobtrusive -->
        <div class="instant-greeting" role="note" aria-hidden="false">
          <div class="instant-greeting-message">
            <strong>무엇이든 물어보세요</strong>
            <span class="hint">간단한 질문부터 수업 자료, 일정 확인까지 — 도움을 드릴게요.</span>
          </div>
        </div>

        <!-- Existing state panel kept for compatibility; remains hidden by default in original app logic -->
        <div class="state-panel" hidden>
          <div class="state-card" aria-hidden="true">
            <div class="orb" aria-hidden="true">⚙️</div>
            <h2>시작하려면 질문하세요</h2>
            <p>Multi Model AI 에이전트가 도와드립니다.</p>
            <button class="primary-button" type="button">예시 질문 보기</button>
            <button class="secondary-button" type="button">설정</button>
          </div>
        </div>
      </section>

      <div class="statusbar" role="status" aria-live="polite">
        <div><span class="status-dot" aria-hidden="true"></span><span>연결 상태: 준비됨</span></div>
        <div>버전 1.0</div>
      </div>
    </main>
  </div>

  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    // Accessibility and keyboard improvements
    (function () {
      const body = document.body;
      const mobileMenu = document.querySelector('.mobile-menu');
      const scrim = document.querySelector('.sidebar-scrim');
      const sidebar = document.getElementById('sidebar');
      const chatList = document.querySelector('.chat-list');
      const newChatBtn = document.getElementById('newChatBtn');

      // Utility: find focusable elements within a root
      function getFocusable(root = document) {
        return Array.from(root.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
          .filter(el => el.offsetWidth > 0 || el.offsetHeight > 0 || el === document.activeElement);
      }

      // Manage opening/closing sidebar for mobile
      function openSidebar() {
        body.classList.add('sidebar-open');
        mobileMenu.setAttribute('aria-expanded', 'true');
        scrim.setAttribute('aria-hidden', 'false');
        sidebar.setAttribute('aria-hidden', 'false');
        // focus trap: move focus to first interactive item
        const focusable = getFocusable(sidebar);
        if (focusable.length) focusable[0].focus();
        // prevent background scroll
        body.style.overflow = 'hidden';
        // enable focus trap handling
        document.addEventListener('keydown', trapFocusHandler);
      }

      function closeSidebar() {
        body.classList.remove('sidebar-open');
        mobileMenu.setAttribute('aria-expanded', 'false');
        scrim.setAttribute('aria-hidden', 'true');
        sidebar.setAttribute('aria-hidden', 'true');
        // return focus to menu button
        mobileMenu.focus();
        body.style.overflow = '';
        document.removeEventListener('keydown', trapFocusHandler);
      }

      function toggleSidebar() {
        if (body.classList.contains('sidebar-open')) closeSidebar();
        else openSidebar();
      }

      // Trap focus within sidebar when open (simple implementation)
      function trapFocusHandler(e) {
        if (e.key !== 'Tab') return;
        const focusable = getFocusable(sidebar);
        if (!focusable.length) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];
        if (e.shiftKey) { // backward
          if (document.activeElement === first) {
            e.preventDefault();
            last.focus();
          }
        } else { // forward
          if (document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      }

      // Toggle via click
      mobileMenu.addEventListener('click', function (e) {
        e.preventDefault();
        toggleSidebar();
      });

      // Also toggle via keyboard (Enter/Space) for improved keyboard behavior
      mobileMenu.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggleSidebar();
        }
      });

      // Clicking the scrim closes sidebar
      scrim.addEventListener('click', function () {
        if (body.classList.contains('sidebar-open')) closeSidebar();
      });

      // Close on Escape
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && body.classList.contains('sidebar-open')) {
          e.preventDefault();
          closeSidebar();
        }
      });

      // Ensure sidebar is closed when viewport becomes wide
      let resizeTimeout = null;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function () {
          if (window.innerWidth > 780 && body.classList.contains('sidebar-open')) {
            closeSidebar();
          }
        }, 120);
      });

      // Make chat list items keyboard-activatable: Enter/Space triggers click behavior
      chatList.addEventListener('keydown', function (e) {
        const item = e.target.closest('.chat-item');
        if (!item) return;
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          item.click();
        }
      });

      // Provide a logical activation behavior for sample chat-item click
      chatList.addEventListener('click', function (e) {
        const item = e.target.closest('.chat-item');
        if (!item) return;
        // Mark selected
        chatList.querySelectorAll('.chat-item').forEach(ci => ci.setAttribute('aria-current', 'false'));
        item.setAttribute('aria-current', 'true');
        // On mobile, close the sidebar after selection for smoother workflow
        if (window.innerWidth <= 780 && body.classList.contains('sidebar-open')) {
          closeSidebar();
        }
        // Move focus to the chat area so keyboard users can continue
        const webchat = document.getElementById('webchat');
        if (webchat) webchat.focus();
      });

      // Make new-chat accessible: ensure Enter/Space activates
      newChatBtn.addEventListener('keyup', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          newChatBtn.click();
        }
      });

      // small enhancement: when newChatBtn clicked, focus the chat area
      newChatBtn.addEventListener('click', function () {
        const webchat = document.getElementById('webchat');
        if (webchat) webchat.focus();
      });

      // Initialize ARIA states
      scrim.setAttribute('aria-hidden', 'true');
      sidebar.setAttribute('aria-hidden', 'false');

      // Ensure high-contrast keyboard outline is visible if a keyboard is used
      // The CSS uses :focus-visible; browsers will show it appropriately.

    })();

    // Show the greeting only on initial load if desired
    (function () {
      const greeting = document.querySelector('.instant-greeting');
      // If you integrate with your chat system: hide .instant-greeting when a conversation begins.
      // For now, greeting remains visible (per request).

    })();

    // 기존 기능 유지: 웹챗 초기화 예시 (실제 앱 로직에 맞게 사용)
    console.log('앱 로드 완료 - 접근성 및 버튼 디자인/애니메이션이 적용되었습니다.');
  </script>
