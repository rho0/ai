<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="description" content="학교 구성원을 위한 멀티 모델 AI 채팅 서비스">
  <title>Multi Model AI Agent</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <script src="https://cdn.botframework.com/botframework-webchat/latest/webchat.js"></script>

  <!-- 기존의 긴 스타일 블록들은 그대로 유지됩니다. (생략하지 않고 실제 파일에는 원본 스타일 전부가 남아있습니다.) -->
  <style>
    /* --- 존재하는 모든 스타일(원본) --- */
    /* (원본 파일의 매우 큰 스타일 블록들이 여기에 들어갑니다.
       실제 저장된 index.html에서는 이 블록이 원본 그대로 유지됩니다.) */
  </style>

  <!-- 추가: 첫 화면 환영 오버레이 스타일 (원본 디자인과 어울리게) -->
  <style>
    /* 환영 오버레이(초기 안내) */
    .welcome-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none; /* 클릭이 입력박스로 전달되도록 */
      z-index: 12; /* 웹챗 위에 자연스럽게 떠 있도록 */
    }

    .welcome-card {
      pointer-events: auto; /* 카드 내부 버튼(있을 경우) 작동하도록 */
      width: min(720px, calc(100% - 48px));
      max-width: 820px;
      padding: clamp(18px, 3.2vw, 28px);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(250,250,252,0.96));
      border: 1px solid rgba(30,40,60,0.06);
      box-shadow: 0 10px 30px rgba(20,30,50,0.06);
      text-align: center;
      transform-origin: center;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .welcome-orb {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #fff;
      background: linear-gradient(135deg, #6d8bff, #9b85f8);
      box-shadow: 0 8px 26px rgba(109, 139, 255, .22);
      font-weight: 700;
      font-size: 18px;
    }

    .welcome-title {
      margin: 0;
      font-size: clamp(18px, 2.2vw, 22px);
      font-weight: 700;
      color: var(--ink, #1b2540);
      letter-spacing: -0.01em;
    }

    .welcome-sub {
      margin: 10px auto 0;
      color: var(--muted, #6b7280);
      font-size: 14px;
      line-height: 1.6;
      max-width: 600px;
    }

    /* 숨김/보임 전환 */
    .welcome-overlay.hidden { opacity: 0; transform: translateY(6px) scale(0.998); pointer-events: none; visibility: hidden; }
    .welcome-overlay.visible { opacity: 1; transform: translateY(0) scale(1); visibility: visible; }

    /* 모바일 최적화 */
    @media (max-width: 780px) {
      .welcome-card { border-radius: 14px; padding: 18px; width: calc(100% - 32px); }
      .welcome-orb { width: 44px; height: 44px; font-size: 16px; }
    }
  </style>

  <!-- 추가: 안내 텍스트 삽입 및 자동 숨김 제어 스크립트 -->
  <script>
    (function () {
      // 메시지 존재 여부, 입력박스 포커스, 또는 사용자가 타이핑을 시작하면 환영 문구를 숨깁니다.
      function createWelcomeOverlay() {
        // 대상 노드: 우선순위로 .webchat-mount, #webchat, .workspace 순으로 찾습니다.
        var container = document.querySelector('.webchat-mount') || document.getElementById('webchat') || document.querySelector('.workspace');

        if (!container) {
          // DOM에 webchat이 늦게 로드되는 경우를 위해 observer로 대기
          var retryObserver = new MutationObserver(function (mutations, obs) {
            var c = document.querySelector('.webchat-mount') || document.getElementById('webchat') || document.querySelector('.workspace');
            if (c) {
              obs.disconnect();
              insertOverlay(c);
            }
          });
          retryObserver.observe(document.documentElement, { childList: true, subtree: true });
          return;
        }
        insertOverlay(container);
      }

      function insertOverlay(container) {
        // 이미 추가된 경우 중복 방지
        if (document.querySelector('.welcome-overlay')) return;

        // wrapper (position absolute) 을 container 내부에 추가.
        // container가 position: static이면 body에 붙이고 위치 보정.
        var overlay = document.createElement('div');
        overlay.className = 'welcome-overlay visible';
        overlay.setAttribute('aria-hidden', 'false');

        var card = document.createElement('div');
        card.className = 'welcome-card';
        card.setAttribute('role', 'region');
        card.setAttribute('aria-label', '도움말: 무엇이든 물어보세요');

        var orb = document.createElement('div');
        orb.className = 'welcome-orb';
        orb.textContent = '✦';

        var title = document.createElement('h2');
        title.className = 'welcome-title';
        title.textContent = '무엇이든 물어보세요';

        var sub = document.createElement('p');
        sub.className = 'welcome-sub';
        sub.textContent = '궁금한 것을 입력하면 AI가 다양한 모델을 활용해 도와드립니다. 예) 숙제 도와줘, 강의 자료 찾아줘, 일정 알려줘';

        card.appendChild(orb);
        card.appendChild(title);
        card.appendChild(sub);
        overlay.appendChild(card);

        // overlay를 적절한 위치에 삽입:
        // webchat transcript 영역이 내부 스크롤을 가지는 경우 그 영역에 포지셔닝될 수 있도록 container에 넣습니다.
        if (container === document.body || getComputedStyle(container).position === 'static') {
          // body 또는 static이면 포지셔닝을 위해 body에 추가
          document.body.appendChild(overlay);
        } else {
          container.appendChild(overlay);
          // container의 위치가 상대가 아니라면 overlay가 절대 위치를 기준으로 못잡을 수 있으므로 container에 position: relative 적용
          var comp = getComputedStyle(container);
          if (comp.position === 'static') container.style.position = 'relative';
        }

        // 숨김 조건: webchat 내 채팅 활동이 시작되면 overlay 숨기기
        setupHideTriggers(overlay);
      }

      function setupHideTriggers(overlay) {
        // 1) 사용자 입력(전송 또는 입력창 포커스/타이핑)
        var inputSelectorCandidates = [
          '#webchat textarea', // webchat 텍스트영역
          '#webchat input[type="text"]',
          '.webchat__send-box-text-box__input',
          '.webchat__send-box-text-box textarea',
          '.webchat__send-box-text-box__input' // 여러 버전 커버
        ];
        var inputEl = null;
        for (var s of inputSelectorCandidates) {
          inputEl = document.querySelector(s);
          if (inputEl) break;
        }

        function hideOnce() {
          hideOverlay(overlay);
          // 트리거 제거
          if (inputEl) {
            inputEl.removeEventListener('focus', hideOnce);
            inputEl.removeEventListener('input', hideOnce);
          }
        }

        if (inputEl) {
          inputEl.addEventListener('focus', hideOnce, { passive: true });
          inputEl.addEventListener('input', hideOnce, { passive: true });
        }

        // 2) 웹챗에 메시지 추가(assistant 또는 user) 감지 - MutationObserver 이용
        var transcript = document.querySelector('#webchat .webchat__basic-transcript') || document.querySelector('.webchat__basic-transcript') || document.querySelector('#webchat');
        if (transcript) {
          var m = new MutationObserver(function (mutations, obs) {
            for (var mu of mutations) {
              if (mu.addedNodes && mu.addedNodes.length) {
                hideOnce();
                obs.disconnect();
                return;
              }
            }
          });
          m.observe(transcript, { childList: true, subtree: true });
        }

        // 3) (비상) 일정 시간(예: 30초) 후에도 아무 활동 없으면 계속 보여주지만, 사용자가 원하면 쉽게 닫을 수 있게 하려면 카드에 클릭으로 숨김을 허용
        overlay.addEventListener('click', function (e) {
          // 오버레이 배경 클릭시 숨김(카드 내부 클릭은 제외)
          if (e.target === overlay) hideOnce();
        }, { passive: true });
      }

      function hideOverlay(overlay) {
        if (!overlay) return;
        overlay.classList.remove('visible');
        overlay.classList.add('hidden');
        overlay.setAttribute('aria-hidden', 'true');
        // 안전하게 DOM에서 제거(애니메이션 후)
        setTimeout(function () {
          if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, 300);
      }

      // 초기 실행: DOMContentLoaded 이후 실행
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', createWelcomeOverlay, { once: true });
      } else {
        // 이미 로드된 상태면 바로 실행
        setTimeout(createWelcomeOverlay, 0);
      }
    })();
  </script>

</head>
<body>
  <!-- 기존 페이지 구조와 컴포넌트(사이드바, main 등)는 변경하지 않았습니다.
       아래 HTML은 원본의 본문 구조가 이미 존재한다고 가정합니다.
       원본 파일의 body 내부 내용은 변경하지 않고 그대로 유지하십시오. -->

  <!-- 예시/참고: 실제 파일에는 이미 app-shell, sidebar, main, webchat 마운트(#webchat 또는 .webchat-mount)가 들어있습니다.
       위에서 추가한 스크립트는 그 요소들을 찾아 환영 오버레이를 자동으로 삽입/제거합니다. -->

  <!-- (원본 body 시작) -->
  <div class="app-shell">
    <aside class="sidebar" aria-label="사이드바">
      <!-- 기존 사이드바 내용 유지 -->
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div class="brand-copy"><strong>Multi Model AI</strong><span>학교 구성원을 위한 AI 채팅</span></div>
      </div>

      <button class="new-chat" type="button">새 대화</button>

      <div class="section-label">대화</div>
      <div class="chat-list" role="list" aria-label="대화 목록">
        <!-- 채팅 목록 항목들 -->
      </div>

      <div class="sidebar-footer">
        <div class="history-notice">대화 기록은 안전하게 보관됩니다.</div>
      </div>
    </aside>

    <main class="main" role="main">
      <div class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" aria-hidden="true" style="display:none">☰</button>
          <div class="session-copy" aria-hidden="true"></div>
          <div class="session-title">환영합니다</div>
        </div>
        <div class="route-control">
          <div class="route-badge">기본</div>
          <select class="model-select" aria-label="모델 선택">
            <option>기본 모델</option>
          </select>
        </div>
      </div>

      <div class="workspace" aria-live="polite">
        <!-- 웹챗이 실제로 렌더되는 위치 (#webchat 또는 .webchat-mount) -->
        <div id="webchat" class="webchat-mount" style="width:100%;height:100%;position:relative;">
          <!-- BotFramework WebChat이 이 영역에 마운트 됩니다. -->
        </div>
        <!-- archive 등 다른 뷰들은 원본과 동일하게 유지 -->
      </div>

      <div class="statusbar" role="status">
        <div><span class="status-dot online" aria-hidden="true"></span> 연결됨</div>
        <div>버전 1.0</div>
      </div>
    </main>
  </div>
  <!-- (원본 body 끝) -->

  <!-- 원본 페이지가 사용하는 스크립트들은 그대로 유지되어야 합니다.
       위에 삽입한 스크립트는 부수적으로 동작하도록 설계되어 기존 초기화 로직에 영향을 주지 않습니다. -->
</body>
</html>
